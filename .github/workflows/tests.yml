name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf ffmpeg
      - name: Python syntax (3.10, Mint 21's version)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m compileall -q poortwachter
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Shell scripts
        run: for f in install.sh uninstall.sh bin/poortwachter-update; do bash -n "$f"; done
      - name: JavaScript syntax
        run: node --check web/app.js
