<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poortwachter</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="/favicon.svg" alt="" width="30" height="30">
      <div>
        <div class="brand-name">Poortwachter</div>
        <div class="brand-sub">Eerst Nederlands, dan spelen</div>
      </div>
    </div>
    <nav id="nav">
      <a href="#today" data-view="today">Today</a>
      <a href="#tomorrow" data-view="tomorrow">Tomorrow</a>
      <a href="#textbook" data-view="textbook">Textbook</a>
      <a href="#library" data-view="library">Library</a>
      <a href="#history" data-view="history">History</a>
      <a href="#settings" data-view="settings">Settings</a>
    </nav>
  </header>

  <section id="lockbar" class="lockbar" aria-live="polite"></section>

  <main id="view"></main>

  <div id="panel-wrap" class="panel-wrap" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
      <button class="panel-close" id="panel-close" aria-label="Close">×</button>
      <div id="panel"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
